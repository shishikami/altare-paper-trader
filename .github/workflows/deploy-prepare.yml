name: Manual paper release preparation (NO remote deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Build allowlisted deployment archive (no runtime state)
        run: |
          mkdir release-package
          tar --exclude=__pycache__ -czf release-package/paper-trader.tar.gz papertrader config deploy README.md pyproject.toml
          cd release-package
          sha256sum paper-trader.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-release-${{ github.sha }}
          path: release-package/
          retention-days: 14
